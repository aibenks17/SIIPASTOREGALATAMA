<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS Live Overlay - Galatama Engine V6</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    /* SCROLLBAR TIPIS & BAGUS */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: #9d4edd;
      border-radius: 10px;
    }

    body {
      background: transparent !important;
      color: #fff;
      padding: 10px;
      overflow: hidden;
      display: flex;
      justify-content: flex-start;
    }

    .obs-box {
      background: rgba(8, 5, 20, 0.90);
      border: 2px solid #9d4edd;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 0 20px rgba(157, 78, 221, 0.4);
      backdrop-filter: blur(12px);
      width: 320px; 
      max-width: 100%;
      display: flex;
      flex-direction: column;
    }

    .obs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .obs-title {
      font-size: 11px;
      font-weight: 900;
      color: #ffb703;
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px rgba(255, 183, 3, 0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* BADGE TIMER JAUH LEBIH GEDE & MENCOLOK */
    .timer-badge-box {
      background: rgba(0, 245, 212, 0.1);
      border: 1.5px solid #00f5d4;
      border-radius: 12px;
      padding: 6px 12px;
      text-align: center;
      margin-bottom: 10px;
      box-shadow: 0 0 12px rgba(0, 245, 212, 0.25);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .timer-label {
      font-size: 10px;
      font-weight: 900;
      color: #94a3b8;
      letter-spacing: 1px;
    }

    .obs-timer {
      font-size: 22px; /* DIBERASIN BIAR JELAS DI STREAM */
      font-weight: 900;
      font-family: monospace;
      color: #00f5d4;
      text-shadow: 0 0 12px rgba(0, 245, 212, 0.8);
      letter-spacing: 1.5px;
    }

    /* KONTAINER SCROLL AREA */
    .table-scroll-container {
      overflow-y: auto;
      max-height: 380px;
      padding-right: 2px;
    }

    table { width: 100%; border-collapse: collapse; }
    
    thead {
      position: sticky;
      top: 0;
      background: rgba(8, 5, 20, 0.98);
      z-index: 10;
    }

    th {
      text-align: left;
      color: #94a3b8;
      font-size: 9px;
      font-weight: 800;
      padding: 4px 2px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    td {
      padding: 6px 2px;
      font-size: 10px;
      font-weight: 700;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      vertical-align: middle;
    }

    .user-avatar {
      width: 22px; 
      height: 22px; 
      border-radius: 50%; 
      object-fit: cover;
      border: 1px solid #00f5d4;
      flex-shrink: 0;
    }

    .avatar-cell { 
      display: flex; 
      align-items: center; 
      gap: 6px; 
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 190px;
    }

    .avatar-cell b {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-num { font-weight: 900; color: #00f5d4; width: 22px; }
    .score-num { font-weight: 900; color: #ffb703; font-size: 11px; text-align: right; }
  </style>
</head>
<body>

  <div class="obs-box">
    <div class="obs-header">
      <div class="obs-title">👑 LIVE LEADERBOARD (SIIPA STORE)</div>
    </div>

    <!-- BOX TIMER GEDE NEON -->
    <div class="timer-badge-box">
      <span class="timer-label">⏱️ SISA WAKTU:</span>
      <div class="obs-timer" id="obsTimerDisplay">15:00</div>
    </div>

    <div class="table-scroll-container">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Peserta</th>
            <th style="text-align:right;">Pts</th>
          </tr>
        </thead>
        <tbody id="obsTbody">
          <tr><td colspan="3" style="text-align:center; color:#94a3b8;">Menunggu data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const DEFAULT_AVATAR = 'https://api.dicebear.com/7.x/bottts/svg?seed=';

    function updateOBSOverlay() {
      const saved = localStorage.getItem('GALATAMA_STATE_V6_LEAN');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          const limit = data.obsLimit || 5;
          
          // Update Timer
          if (data.timer) {
            const sec = data.timer.secondsLeft;
            const m = String(Math.floor(sec / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            document.getElementById('obsTimerDisplay').innerText = `${m}:${s}`;
          }

          // Update Leaderboard
          if (data.participants) {
            const sorted = [...data.participants].sort((a,b) => b.totalScore - a.totalScore);
            document.getElementById('obsTbody').innerHTML = sorted.slice(0, limit).map((p, i) => `
              <tr>
                <td class="rank-num">#${i+1}</td>
                <td class="avatar-cell">
                  <img src="${p.avatar || DEFAULT_AVATAR + p.name}" class="user-avatar">
                  <b>${p.name}</b>
                </td>
                <td class="score-num">${p.totalScore}</td>
              </tr>
            `).join('') || '<tr><td colspan="3" style="text-align:center;">Belum ada peserta.</td></tr>';
          }
        } catch(e) {
          console.error(e);
        }
      }
    }

    setInterval(updateOBSOverlay, 500);
    window.addEventListener('DOMContentLoaded', updateOBSOverlay);
  </script>
</body>
</html>
