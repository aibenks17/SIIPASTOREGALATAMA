<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS Live Overlay - Galatama Engine V6</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    /* SCROLLBAR CUSTOM STYLING */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #9d4edd;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(157, 78, 221, 0.8);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00f5d4;
    }

    body {
      background: transparent !important;
      color: #fff;
      padding: 16px;
      overflow: hidden;
    }
    .obs-box {
      background: rgba(8, 5, 20, 0.88);
      border: 2px solid #9d4edd;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 0 30px rgba(157, 78, 221, 0.4);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      max-height: 90vh; /* Membatasi tinggi kontainer biar kontainer utama gak melimpah */
    }
    .obs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .obs-title {
      font-size: 12px;
      font-weight: 900;
      color: #ffb703;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(255, 183, 3, 0.5);
    }
    .obs-timer {
      font-size: 14px;
      font-weight: 900;
      font-family: monospace;
      color: #00f5d4;
      text-shadow: 0 0 10px rgba(0, 245, 212, 0.5);
    }

    /* KONTAINER SCROLL UNTUK TABEL */
    .table-scroll-container {
      overflow-y: auto;
      max-height: 480px; /* Batas tinggi scroll area */
      padding-right: 4px;
    }

    table { width: 100%; border-collapse: collapse; }
    
    thead {
      position: sticky;
      top: 0;
      background: rgba(8, 5, 20, 0.95); /* Biar header tabel gak ketimpa saat discroll */
      z-index: 10;
    }

    th {
      text-align: left;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 800;
      padding: 6px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    td {
      padding: 8px 4px;
      font-size: 11px;
      font-weight: 700;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      vertical-align: middle;
    }
    .user-avatar {
      width: 26px; height: 26px; border-radius: 50%; object-fit: cover;
      border: 1px solid #00f5d4;
    }
    .avatar-cell { display: flex; align-items: center; gap: 8px; }
    .rank-num { font-weight: 900; color: #00f5d4; }
    .score-num { font-weight: 900; color: #ffb703; font-size: 12px; }
  </style>
</head>
<body>

  <div class="obs-box">
    <div class="obs-header">
      <div class="obs-title">👑 LIVE LEADERBOARD (SIIPA STORE)</div>
      <div class="obs-timer" id="obsTimerDisplay">15:00</div>
    </div>

    <!-- AREA YANG BISA DI-SCROLL -->
    <div class="table-scroll-container">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Peserta</th>
            <th style="text-align:right;">Poin</th>
          </tr>
        </thead>
        <tbody id="obsTbody">
          <tr><td colspan="3" style="text-align:center; color:#94a3b8;">Menunggu data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const DEFAULT_AVATAR = 'https://api.dicebear.com/7.x/bottts/svg?seed=';

    function updateOBSOverlay() {
      const saved = localStorage.getItem('GALATAMA_STATE_V6_LEAN');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          const limit = data.obsLimit || 5;
          
          // Update Timer
          if (data.timer) {
            const sec = data.timer.secondsLeft;
            const m = String(Math.floor(sec / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            document.getElementById('obsTimerDisplay').innerText = `${m}:${s}`;
          }

          // Update Leaderboard sesuai limit kustom
          if (data.participants) {
            const sorted = [...data.participants].sort((a,b) => b.totalScore - a.totalScore);
            document.getElementById('obsTbody').innerHTML = sorted.slice(0, limit).map((p, i) => `
              <tr>
                <td class="rank-num">#${i+1}</td>
                <td class="avatar-cell">
                  <img src="${p.avatar || DEFAULT_AVATAR + p.name}" class="user-avatar">
                  <b>${p.name}</b>
                </td>
                <td style="text-align:right;" class="score-num">${p.totalScore}</td>
              </tr>
            `).join('') || '<tr><td colspan="3" style="text-align:center;">Belum ada peserta.</td></tr>';
          }
        } catch(e) {
          console.error(e);
        }
      }
    }

    setInterval(updateOBSOverlay, 500);
    window.addEventListener('DOMContentLoaded', updateOBSOverlay);
  </script>
</body>
</html>
