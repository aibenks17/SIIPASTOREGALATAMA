<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GALATAMA STREAM OVERLAY HUD</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: transparent !important;
      overflow: hidden;
      padding: 20px;
    }
    .obs-hud-container {
      width: 380px;
      background: rgba(13, 10, 29, 0.92);
      border: 2px solid var(--purple-main);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 0 30px rgba(157, 78, 221, 0.5);
      backdrop-filter: blur(10px);
    }
    .obs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--purple-main);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .obs-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 10px rgba(255, 183, 3, 0.5);
    }
    .obs-timer-badge {
      font-family: 'Orbitron', monospace;
      font-size: 16px;
      font-weight: 900;
      color: var(--cyan-accent);
      background: rgba(0, 245, 212, 0.1);
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid var(--cyan-accent);
      text-shadow: 0 0 8px var(--cyan-accent);
    }
    .obs-table {
      width: 100%;
      border-collapse: collapse;
    }
    .obs-table th {
      font-size: 10px;
      color: var(--text-muted);
      padding-bottom: 6px;
      text-align: left;
    }
    .obs-table td {
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 11px;
    }
    .obs-rank {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      width: 30px;
    }
    .obs-score {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      color: var(--cyan-accent);
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="obs-hud-container">
    <div class="obs-header">
      <div class="obs-title" id="overlayEventTitle">LIVE LEADERBOARD</div>
      <div class="obs-timer-badge" id="overlayTimer">15:00</div>
    </div>
    <table class="obs-table">
      <thead>
        <tr>
          <th>#</th>
          <th>PESERTA</th>
          <th style="text-align: right;">POIN</th>
        </tr>
      </thead>
      <tbody id="overlayTbody">
        <tr><td colspan="3" style="color:var(--text-muted); text-align:center;">Menunggu Data...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    function updateOverlay() {
      const saved = localStorage.getItem('GALATAMA_STATE_V7_0');
      if (!saved) return;
      try {
        const state = JSON.parse(saved);
        
        // Update Title
        document.getElementById('overlayEventTitle').innerText = state.eventTitle || 'GALATAMA LIVE';
        
        // Update Timer
        const sec = state.timer?.secondsLeft || 0;
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        document.getElementById('overlayTimer').innerText = `${m}:${s}`;

        // Update Theme Class
        document.body.className = `theme-${state.theme || 'cyberneon'}`;

        // Update Leaderboard List
        const limit = state.overlayLimit || 10;
        const sorted = [...(state.participants || [])].sort((a,b) => b.totalScore - a.totalScore).slice(0, limit);

        document.getElementById('overlayTbody').innerHTML = sorted.map((p, i) => `
          <tr>
            <td class="obs-rank" style="color: ${i===0 ? 'var(--gold)' : i===1 ? 'var(--silver)' : i===2 ? 'var(--bronze)' : 'var(--text-main)'};">#${i+1}</td>
            <td class="avatar-cell">
              <img src="${p.avatar}" class="user-avatar" style="width:22px; height:22px;">
              <b style="font-size:11px;">${p.name}</b>
            </td>
            <td class="obs-score">${p.totalScore}</td>
          </tr>
        `).join('');

      } catch(e) { console.error(e); }
    }

    // Auto Refresh Sync setiap 500ms
    setInterval(updateOverlay, 500);
    window.addEventListener('storage', updateOverlay);
    updateOverlay();
  </script>
</body>
</html>
